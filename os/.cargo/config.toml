[build]
target = "loongarch64-unknown-none"

[unstable]
build-std = ["core", "alloc", "compiler_builtins"]

# Keep crates.io registry-backed: the environment rust-src has build dependencies
# that are not part of this project's vendor directory.
[source."git+https://github.com/rcore-os/riscv"]
git = "https://github.com/rcore-os/riscv"
replace-with = "vendored-sources"

[source."git+https://github.com/rcore-os/virtio-drivers?rev=4ee80e5"]
git = "https://github.com/rcore-os/virtio-drivers"
rev = "4ee80e5"
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"

[env]
SMOLTCP_IFACE_MAX_ADDR_COUNT = "128"
